name: Push to Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'integration/**'
      - 'rakuten/**'
      - 'yahoo/**'

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Detect changed GAS folders
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "integration=$(echo "$CHANGED" | grep -q '^integration/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "rakuten=$(echo "$CHANGED" | grep -q '^rakuten/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "yahoo=$(echo "$CHANGED" | grep -q '^yahoo/' && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Push integration
        if: steps.changes.outputs.integration == 'true'
        run: cd integration && clasp push --force

      - name: Deploy integration Web App
        if: steps.changes.outputs.integration == 'true'
        run: |
          cd integration
          # 新しいバージョンを作成
          VERSION_OUTPUT=$(clasp version "Auto-deploy $(date '+%Y-%m-%d %H:%M JST')" 2>&1)
          echo "Version output: $VERSION_OUTPUT"
          VERSION_NUM=$(echo "$VERSION_OUTPUT" | grep -oE '[0-9]+' | tail -1)
          if [ -z "$VERSION_NUM" ]; then
            echo "⚠ バージョン番号取得失敗。スキップします。"
            exit 0
          fi
          echo "✓ 新バージョン: $VERSION_NUM"
          # 既存デプロイを更新（URLを維持）
          DEPLOY_ID="AKfycbxTxVRSWNF8G2vvKKDPBuHPcACnWryorERgVff-xLABBRVWJf64rpvU3a0QYCsMxhH6EA"
          clasp deploy -i "$DEPLOY_ID" -V "$VERSION_NUM" -d "Auto-deploy $(date '+%Y-%m-%d')" 2>&1
          echo "✓ デプロイ完了"

      - name: Push rakuten
        if: steps.changes.outputs.rakuten == 'true'
        run: cd rakuten && clasp push --force

      - name: Push yahoo
        if: steps.changes.outputs.yahoo == 'true'
        run: cd yahoo && clasp push --force
